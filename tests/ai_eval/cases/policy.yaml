# ⚠️ THE POLICY PIN, and why the other case files cannot replace it.
#
# Tier 1's structural check compares the chapters in the prompt against
# `allowed_sections(role)` — the SAME allowlist the pipeline used to build it.
# That catches a RETRIEVAL bug (a context path that forgets to filter) and is
# blind by construction to a POLICY bug (somebody widening `_ROLE_ALLOWED`),
# because widening the allowlist widens the thing it is checked against. Proved
# by negative control on 2026-09-02: granting a Store Keeper chapters 7 and 17
# made ZERO structural checks fail. Only the canaries noticed.
#
# So the allowlists are pinned here as data. A deliberate change is one line in
# this file, in the same commit as the code — which is the point: widening what
# a role may read should be a decision somebody signed, not a diff nobody saw.
#
# ⚠️ ADDING a chapter to a role requires editing this file. REMOVING one does
# not fail (narrowing access is always safe), which is why the check is a
# superset test rather than an equality test.

# ⚠️ SIGNED CHANGE, 2026-09-03 (slice 10b docs): §24 "Phase 10 — Security,
# Training and the Board Brief" was added to EVERY role. That is a deliberate
# widening and this file is where it is recorded, which is the whole reason the
# pin exists — the run that added the chapter failed here first, with nine
# changes listed, before any of them were accepted.
#
# Why every role: §24 is a "what changed" chapter and follows §21's precedent
# exactly. Mandatory 2FA lands on five roles but is worth reading by all nine;
# the Training tab is universal; and §2's access matrix already tells every role
# what every other role can open, so naming the Valuation report's audience in
# §24.3 discloses nothing §2 does not.
# ⚠️ SIGNED CHANGE, 2026-09-04 (slice 11c): §25 "Phase 11 — AI Traces" was added
# to admin and auditor ONLY.
#
# Deliberately NOT every role, which breaks the §21/§24 precedent above and does
# so on purpose. Those are "what changed" chapters about features the whole site
# uses. §25 documents ONE read-only page that only these two roles can open —
# answering a store keeper out of it would explain a screen the navigation
# refuses them, which is worse than the refusal.
# ⚠️ SIGNED CHANGE, 2026-09-24 (rule 17, Practice sandbox): §26 "Practice
# Mode" was added to EVERY role. Every role has a shared practice account and a
# Live | Practice switch on its sign-in screen, and a trainee who asks why their
# photo will not read, or why a video did not count, must be answered out of
# the chapter that says so. The chapter is written for users: the server-side
# setup (roles, passwords, deploy variables) was deliberately put in §17.9,
# which stays admin-only with the rest of §17.
