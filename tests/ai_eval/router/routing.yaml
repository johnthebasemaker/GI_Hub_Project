# tests/ai_eval/router/routing.yaml — System One routing evals (Phase 17).
#
# Labelled prompts, fifteen per intent. Every one is SAFE; the security set is
# security.yaml. Scored by `python -m tests.ai_eval.runner --router`:
#   macro accuracy over the four intents   >= 0.90   gate
#   every single intent                    >= 0.80   gate
#
# `rules` marks a prompt stage 0 is EXPECTED to decide without the model (an
# explicit page name or video word). Those are scored deterministically in L2
# as well, so a regression in the cheap path is caught without a model.
#
# ⚠️ Public repository: written for this file, never pasted from ai_traces.
# ⚠️ Nothing here may repeat a few-shot example from system_one_prompt.md.

