# tests/ai_eval/router/tutorial_retrieval.yaml — "video RAG" evals (Phase 17d).
#
# The System One router sends TUTORIAL_SEARCH questions straight to
# `ai/tutorials.match()` — BM25 over one chunk per recorded BEAT, fenced by each
# tutorial's `audience` BEFORE anything is scored (P12-6), with two floors
# (score >= 4.0 AND >= 2 shared tokens). This file checks that path from the
# outside, deterministically, over the committed fixture
# `tests/ai_eval/fixtures/tutorials/` (4 tutorials, 25 beats — a small corpus,
# reported as such, not padded).
#
# Three kinds of case:
#   hit   — expect {tutorial, beat}: the right MOMENT, not just the right video
#   fence — a role outside the tutorial's audience asks; expect null (P12-6)
#   miss  — an allowed role asks something no tutorial covers; expect null.
#           "The closest of four videos" is not "a video about this" — a
#           confidently wrong link costs the reader ninety seconds.
#
# Gated by `python -m tests.ai_eval.runner` (no model): hit recall@1 >= 0.85
# and ZERO fence leaks — a returned beat from a tutorial whose audience excludes
# the asking role, the same zero tolerance a leak gets in Tier 1. Phrased
# deliberately unlike the narration ("obscure"), so a pass means retrieval, not
# string matching.
#
# ⚠️ FALSE HITS ON `miss` CASES ARE A RATCHET, NOT ZERO — and that is a measured
# finding, not a choice. Measured 2026-10-03: 3 of 7 misses got a confident
# wrong link, every one an HOD question landing on an Executive Summary beat
# (primer drums → `kpis` 4.66, the assistant → `detail` 12.75, booking
# man-hours → `kpis` 6.98). The first two shared only function words and the
# bigrams they form ({many, howmany}, {into, intothe}); ai/tutorials.py
# `_evidence` stopped those counting, the same day. The man-hours one shares a
# real domain term — CX-15's own shape — and stays: the gate is "no worse
# than 1". RULES.md records why the floors are not nudged instead.

# ── hits: HOD — Reading the Executive Summary ────────────────────────────────
- {id: tr.hit.es_range, kind: hit, role: hod, expect: [hod_executive_summary_v1, range],
   question: "on the executive summary, which date range should I choose before reading it?"}
- {id: tr.hit.es_pdf, kind: hit, role: hod, expect: [hod_executive_summary_v1, pdf],
   question: "can I download the executive summary as a proper PDF document?"}
- {id: tr.hit.es_kpis, kind: hit, role: hod, expect: [hod_executive_summary_v1, kpis],
   question: "what does the strip across the top of the summary tell me about material received and issued?"}
- {id: tr.hit.es_detail, kind: hit, role: hod, expect: [hod_executive_summary_v1, detail],
   question: "a consumption figure on the summary looks wrong — where are the rows behind it?"}
- {id: tr.hit.es_procurement, kind: hit, role: hod, expect: [hod_executive_summary_v1, procurement],
   question: "where does the summary show purchase orders and delivery notes still in flight?"}
- {id: tr.hit.es_floor, kind: hit, role: hod, expect: [hod_executive_summary_v1, floor],
   question: "why is a material with no unit cost reported as not valued instead of zero?"}

