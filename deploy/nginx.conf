# ============================================================================
# deploy/nginx.conf — reverse proxy for the new-stack (React SPA + FastAPI).
#
# Rendered by nginx:alpine's envsubst on boot (nginx runtime vars like $uri /
# $host are left untouched). Under the tunnel topology no ${VAR} remains to
# substitute — the server block is a catch-all, because the only client is
# cloudflared on the private network. The `web` service still receives DOMAIN
# so the template keeps working if a host-specific block is ever reinstated.
#
# TOPOLOGY: behind a Cloudflare Tunnel. Cloudflare's edge terminates TLS and
# enforces Zero Trust Access, then cloudflared forwards PLAIN HTTP to this
# container over the private Docker network. So:
#
#   * there is exactly one server block, on :80, and no TLS here — the
#     certificate lives at Cloudflare, and there is no certbot service;
#   * there is no ACME webroot and no http→https redirect. A redirect would
#     loop: the edge already served the client over HTTPS, and this hop is
#     internal-only;
#   * :80 is NOT published to the host (see docker-compose.prod.yml) — nothing
#     but cloudflared can reach it.
#
# The /api/ proxy has a TRAILING SLASH on proxy_pass, so it strips the /api
# prefix: /api/auth/login → http://api:8000/auth/login (backend routes are at
# /auth, /inventory, … — matches the frontend's axios baseURL '/api' + the Vite
# dev proxy rewrite, so the same relative paths work in dev and prod).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    # Catch-all: the Host arriving through the tunnel is the public hostname,
    # but health probes and in-network calls use the service name `web`.
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # --- Content-Security-Policy -------------------------------------------
    # Caps the blast radius of any future XSS: with no inline script allowed,
    # an injected payload cannot execute even if it reaches the DOM, and it
    # cannot phone home to an attacker host. Tuned to what the SPA actually
    # does — verified against frontend/dist/index.html and the source tree, so
    # every directive below is the MINIMUM the app needs:
    #
    #   script-src 'self'      the Vite build emits only external hashed
    #                          modules — the built index.html contains no
    #                          inline <script>, and there is no eval / new
    #                          Function / WebAssembly anywhere in src/.
    #   style-src  'unsafe-inline'
    #                          REQUIRED. Ant Design v5 is CSS-in-JS and injects
    #                          <style> at runtime; dropping this blanks the UI.
    #   img-src    data: blob: data: for the 2FA enrolment QR (/auth/2fa/enroll
    #                          returns a data:image/png), blob: for the object
    #                          URLs the download helpers create.
    #   connect-src            'self' covers the same-origin /api proxy and the
    #                          SSE assistant stream. The two named hosts are the
    #                          ServerConfigModal presets (src/components/
    #                          ServerConfigModal.tsx) — without them, switching
    #                          backend from the web build breaks.
    #   worker-src / manifest-src
    #                          the vite-plugin-pwa service worker + webmanifest.
    #   frame-src  'self' blob:
    #                          the Document Library previews PDFs in an iframe
    #                          pointed at /api/entry/attachments/{id}/download.
    #   object-src 'none'      no <object>/<embed> plugin surface at all.
    #
    # INHERITANCE: nginx add_header is REPLACED, not merged, by any location
    # that declares an add_header of its own. `location /assets/` sets
    # Cache-Control and so silently dropped every header in this block — which
    # is why the three below are repeated verbatim inside it. Add a header
    # here and you must add it there too; there is no directive that merges
    # them. See the comment on that location.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://gi.giinventory.com https://local.giinventory.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    client_max_body_size 25m;   # report downloads / uploads headroom

    # --- API → FastAPI (internal service `api`, no host port) ---------------
    location /api/ {
        proxy_pass http://api:8000/;      # trailing slash strips the /api prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Client-IP chain under the tunnel. The API resolves the rate-limit key
        # as CF-Connecting-IP → X-Real-IP → peer. $remote_addr here is the
        # CLOUDFLARED CONTAINER, not the user, so X-Real-IP alone would key
        # every request in the world onto one bucket. CF-Connecting-IP is set by
        # Cloudflare's edge and carries the true client address — forward it
        # explicitly rather than relying on nginx's default header pass-through.
        # If it is ever absent the header is empty, and the API falls through to
        # the next source rather than trusting a blank value.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The edge served the user over HTTPS even though this hop is HTTP.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;          # PDF/Excel report generation headroom
    }

    # --- Practice API (rule 17) → the SECOND process `api-training` ----------
    # Resolved at REQUEST time through Docker's DNS (the variable is what
    # defers it): a box without the `practice` profile has no `api-training`
    # container, and a static proxy_pass to it would stop nginx from starting
    # at all — taking Live down for a feature that is switched off. With the
    # variable, /training-api/ is simply a 502 there and Live is untouched.
    # The rewrite does what the /api/ trailing slash does: strip the prefix.
    location /training-api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $practice_upstream api-training:8000;
        rewrite ^/training-api/(.*)$ /$1 break;
        proxy_pass http://$practice_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # --- React SPA: hashed assets cache-forever, index.html no-cache --------
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # REPEATED, not inherited. Declaring Cache-Control above replaces the
        # whole server-level add_header set, so without these three lines the
        # hashed JS/CSS bundles — the most security-sensitive thing this server
        # hands out — were served with no nosniff and no framing policy at all.
        # Keep in sync with the server block above.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://gi.giinventory.com https://local.giinventory.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # client-side routing fallback
    }
}
