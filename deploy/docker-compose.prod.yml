# ============================================================================
# deploy/docker-compose.prod.yml — NEW-STACK production (React + FastAPI + PG).
#
# This is the React/FastAPI/Postgres stack (the one made feature-complete in the
# 2026-07 build), NOT the Streamlit app at the repo-root docker-compose.yml.
# Run it from THIS directory:  docker compose -f docker-compose.prod.yml ...
# Build context is the repo root (`context: ..`).
#
# TOPOLOGY: Cloudflare Tunnel — the box publishes NO host ports at all.
# Inbound traffic arrives as an OUTBOUND connection from `cloudflared` to
# Cloudflare's edge, which terminates TLS and enforces Zero Trust Access on the
# HTML portal. Nothing here listens on the public internet, so the Hetzner
# firewall can deny all inbound.
#
#   client → Cloudflare edge (TLS + Access) → tunnel → cloudflared → web:80 → api:8000
#
# Services (NONE bind host ports):
#   db         postgres:16   internal          system of record
#   api        FastAPI        internal :8000   async → Postgres
#   web        nginx          internal :80     SPA + /api proxy (plain HTTP)
#   cloudflared cloudflared   no ports          outbound tunnel to Cloudflare
#   ollama     ollama         internal :11434  local LLM (Intelligence layer)
#
# There is deliberately no `certbot` service and no TLS in nginx: Cloudflare
# owns the certificate. Do not re-add port bindings — that would expose the
# origin directly and bypass Access.
#
# Secrets come from deploy/.env (copy .env.example → .env and fill it in).
# ============================================================================

name: gi-hub-newstack

networks:
  gi-new:
    driver: bridge

volumes:
  pg-data-prod:     # PostgreSQL data — the system of record. Backed up by `backup`.
  pg-backups:       # pg_dump output (nightly `backup` + console /admin/backup).
                    # OFF-BOX before go-live: bind this to a Hetzner Storage Box
                    # (same pattern the v1 root compose notes for gi-backups),
                    # e.g.
                    #   pg-backups:
                    #     driver_opts:
                    #       type: cifs
                    #       o: "username=…,password=…,uid=10001,vers=3.0"
                    #       device: "//<box>.your-storagebox.de/backup"
  ollama-models:    # pulled model weights (llama3.1:8b ≈ 5 GB, qwen2.5vl:7b ≈ 5 GB)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data-prod:/var/lib/postgresql/data
    networks: [gi-new]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # deploy/.env is read by compose for ${VAR} interpolation, but that does NOT
    # put anything inside the container. Without this env_file the API received
    # none of WHATSAPP_*, SMTP_*, EMAIL_LOGISTICS_TO, PUBLIC_BASE_URL or
    # GI_TRUSTED_PROXIES: WhatsApp and email would degrade to "not configured"
    # and the weekly-report links would point at localhost. Explicit
    # `environment:` keys below still take precedence over the file.
    env_file:
      - .env
    environment:
      GI_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      # asyncpg URL (config.async_database_url normalises psycopg2/plain forms too).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Blank in production = NO cross-origin access (Theme C). Browser-only
      # deployments can leave it unset; the native shells need their webview
      # origins listed in deploy/.env or every native API call fails.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Trust forwarded client-IP headers only from this peer (audit A03-F6).
      GI_TRUSTED_PROXIES: ${GI_TRUSTED_PROXIES:-}
      # Base URL for outbound capability links; the API refuses to boot in
      # production if this is unset or points at localhost (audit A04-F7).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Intelligence layer (Phase AI-*): local Ollama service. Leave as-is;
      # the AI endpoints degrade to a friendly notice when it's unreachable.
      OLLAMA_HOST: http://ollama:11434
      GI_AI_CONCURRENCY: ${GI_AI_CONCURRENCY:-2}
      # Console /admin/backup (manual pg_dump) writes here; shared with the
      # `backup` service's pg-backups volume so manual + nightly dumps unify.
      GI_BACKUPS_DIR: /backups
    volumes:
      - pg-backups:/backups
    networks: [gi-new]
    # No host ports — reached only via nginx (`web`) at /api/.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Practice (rule 17) — a SECOND API process on its own database ─────────
  # Same image, different environment. Behind the `practice` PROFILE, so a box
  # that has not configured it deploys exactly as before; deploy-v2.sh adds
  # `--profile practice` once PRACTICE_JWT_SECRET is set.
  #
  # ⚠️ NO `env_file: .env`, and that is the point: deploy/.env holds the live
  # Meta token and SMTP password, and a Practice process must not be ABLE to
  # send (config.assert_instance_safe refuses to boot if one reaches it). Every
  # variable it needs is listed explicitly below.
  #
  # It connects as `gi_training`, which has NO CONNECT on ${POSTGRES_DB}
  # (tools/practice_db.py wall) — the wall is a Postgres privilege, not this file.
  # ONE worker: the reset's DROP … WITH (FORCE) terminates only sessions this
  # role may signal, and a class of trainees does not need four.
  api-training:
    profiles: [practice]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      GI_ENV: production
      GI_INSTANCE: training
      GI_DOTENV: "0"
      GI_OUTBOUND: "off"
      # MUST differ from JWT_SECRET — deploy-v2.sh refuses to continue if equal.
      # ⚠️ `:-`, NOT `:?`. Compose interpolates EVERY service, including ones
      # whose profile is off, so a `:?` here made the whole file invalid on a
      # box that has not configured Practice — a Live deploy broken by a
      # feature that is switched off (caught by `docker compose config`,
      # 2026-09-26). The guard lives where it cannot break Live: deploy-v2.sh
      # adds `--profile practice` only when both values are set, and a blank
      # key is refused at boot anyway (GI_ENV=production → config.jwt_secret).
      JWT_SECRET: ${PRACTICE_JWT_SECRET:-}
      DATABASE_URL: postgresql+asyncpg://gi_training:${PRACTICE_DB_PASSWORD:-}@db:5432/gihub_training
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GI_TRUSTED_PROXIES: ${GI_TRUSTED_PROXIES:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      OLLAMA_HOST: http://ollama:11434
      GI_AI_CONCURRENCY: "1"
      # Disposable data: no backup volume, no shared report archive (V8).
      GI_BACKUPS_DIR: /tmp/practice-backups
      GI_REPORTS_ARCHIVE_DIR: /tmp/practice-reports
    networks: [gi-new]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/instance').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN}
    # NO `ports:` — nginx is reachable only from inside `gi-new`, via
    # cloudflared. Publishing :80/:443 here would expose the origin directly and
    # let anyone who knows the server IP bypass Cloudflare Access entirely.
    networks: [gi-new]

  # The ONLY ingress. cloudflared dials OUT to Cloudflare's edge and receives
  # proxied requests over that connection, so no inbound port is opened and the
  # host firewall can deny all inbound traffic.
  #
  # TUNNEL_TOKEN comes from the Zero Trust dashboard
  # (Networks → Tunnels → your tunnel → Install connector — the token is the
  # long string in the shown command). Put it in deploy/.env; it is a
  # CREDENTIAL, so the file stays chmod 600 and gitignored.
  #
  # The tunnel's public hostname route must point at **http://web:80** (service
  # name on this network), NOT localhost — cloudflared runs in its own
  # container. Configure the route in the dashboard, or in the tunnel's remote
  # config; do not split /api, because nginx already strips that prefix.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [web]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set in deploy/.env — get it from Zero Trust → Networks → Tunnels}
    networks: [gi-new]

  # Local LLM host for the Intelligence layer (Hub Assistant now; OCR/NL-SQL in
  # later AI phases). CPU inference; NO host ports — internal-only like db/api.
  # RULING 2026-07-06: same box as the stack, ONE warm model at a time —
  # Ollama load-on-demand swaps models (~30-60s penalty) and keep_alive holds
  # the last-used one. Pull models ONCE after first up (they persist in the
  # ollama-models volume):
  #   docker compose -f docker-compose.prod.yml exec ollama ollama pull llama3.1:8b
  #   docker compose -f docker-compose.prod.yml exec ollama ollama pull qwen2.5vl:7b   # Phase AI-3 OCR
  # RAM note (CPX42 16 GB): a 7-8B model uses ~6-8 GB while loaded;
  # OLLAMA_MAX_LOADED_MODELS=1 keeps the budget safe alongside Postgres + the
  # API. If AI latency ever hurts, move this service to a dedicated host and
  # point the api's OLLAMA_HOST env at it.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-models:/root/.ollama
    networks: [gi-new]

  # Nightly pg_dump of pg-data-prod — the ONLY automated backup of the Postgres
  # system of record (the v1 SQLite `backup` service cannot cover Postgres).
  # Custom-format dumps + 14-day retention + .last_success/.last_failure markers,
  # mirroring the v1 backup so the Admin "Service Health" card reads them
  # unchanged. Uses postgres:16-alpine so pg_dump matches the `db` server version
  # (and the image is already pulled). NO host ports — internal-only.
  # Restore:  docker compose -f docker-compose.prod.yml exec -T db \
  #             pg_restore -U $POSTGRES_USER -d $POSTGRES_DB -c < gihub-<stamp>.dump
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      GI_BACKUP_DIR: /backups
      TZ: Asia/Riyadh
      # Off-box S3 (optional — leave AWS_S3_BUCKET blank for local-only backups).
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-gihub}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SSE: ${AWS_SSE:-AES256}
    volumes:
      - pg-backups:/backups
      - ./backup/backup-pg.sh:/usr/local/bin/backup-pg.sh:ro
    networks: [gi-new]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # aws-cli is only needed for the off-box S3 push; harmless if S3 unused.
        apk add --no-cache tzdata aws-cli >/dev/null 2>&1 || apk add --no-cache tzdata >/dev/null
        # Invoke via `sh` so we don't rely on the mounted file's +x bit.
        echo '0 2 * * * /bin/sh /usr/local/bin/backup-pg.sh >> /backups/backup.log 2>&1' > /etc/crontabs/root
        echo "[pg-backup] cron installed — nightly 02:00 Asia/Riyadh. Running an initial pass…"
        /bin/sh /usr/local/bin/backup-pg.sh || true
        exec crond -f -l 8
