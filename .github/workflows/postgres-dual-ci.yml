# ============================================================================
# postgres-dual-ci.yml — Phase 4 dual-backend CI (data layer)
# ----------------------------------------------------------------------------
# Runs on GitHub's runners (no local Docker needed on anyone's machine):
#   1. The full SQLite regression suite (bug_check.py) — the existing safety net.
#   2. tools/dual_ci.py against a real PostgreSQL 16 service — migrates a
#      GENERATED legacy-shaped fixture into Postgres via backend/models.py and
#      asserts cross-backend parity (tables, views, identity-math aggregates).
#      ⚠️ NOT "the committed gi_database.db", which is what this comment used to
#      say: that file has been gitignored since 2026-07-26 (commit a09da0b) and
#      is never in git, so three steps here read a file CI does not have. See
#      tools/make_ci_fixture_db.py.
#
# SCOPE: this validates the DATA LAYER on Postgres (schema, types, data copy,
# view dialect). It does NOT yet run the app itself on Postgres — get_connection()
# is still SQLite-only; that behavioural dual-CI arrives once the engine seam is
# wired into get_connection() in a later phase.
# ============================================================================
name: Postgres dual-CI

on:
  # Phase 17 (ruling Q17-6): path-filtered pushes to ANY branch, plus PRs. It
  # was `main` only, so a feature branch ran nothing until its PR opened.
  push:
    branches: ['**']
    paths:
      - 'legacy/**'
      - 'backend/**'
      - 'frontend/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/postgres-dual-ci.yml'
      # ⚠️ Added in Phase 17 (finding F6): the AI grid is GENERATED from the
      # manual and `gen_eval_grid.py --check` fails when it moves — yet a
      # commit touching only USER_MANUAL.md triggered nothing, so a stale grid
      # surfaced on somebody else's later push.
      - 'USER_MANUAL.md'
      - 'tests/ai_eval/**'
      - 'docs/tutorials/**'
      # ⚠️ 'gi_database.db' was here and could never fire — the file is
      # gitignored, so a push can never contain a change to it.
  pull_request:
    # Same list as `push` (written twice: no YAML anchors in workflow files).
    paths:
      - 'legacy/**'
      - 'backend/**'
      - 'frontend/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/postgres-dual-ci.yml'
      # ⚠️ Added in Phase 17 (finding F6): the AI grid is GENERATED from the
      # manual and `gen_eval_grid.py --check` fails when it moves — yet a
      # commit touching only USER_MANUAL.md triggered nothing, so a stale grid
      # surfaced on somebody else's later push.
      - 'USER_MANUAL.md'
      - 'tests/ai_eval/**'
      - 'docs/tutorials/**'
      # ⚠️ 'gi_database.db' was here and could never fire — the file is
      # gitignored, so a push can never contain a change to it.
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# A branch with an open PR fires BOTH events. One run per branch at a time:
# `head_ref` is the branch on a pull_request event and `ref_name` on a push, so
# the two share a group and the older is cancelled rather than run twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dual-ci:
    runs-on: ubuntu-latest

    # ⚠️ ONE PATH, READ BY FOUR TOOLS. `tools/dual_ci.py`, `tools/parity_check.py`,
    # `tools/migration/cutover_migrate.py` and `backend/api/testdb.py` all default
    # their source to $GI_DB_FILE. Setting it here — rather than passing --source
    # to some of them — is what stops the next person fixing three call sites and
    # missing the fourth, which is exactly how this broke.
    env:
      GI_DB_FILE: ${{ github.workspace }}/ci_fixture.db

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gihub
          POSTGRES_PASSWORD: gihub_ci
          POSTGRES_DB: gihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gihub -d gihub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: System deps (libzbar for pyzbar QR checks)
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary

      # ⚠️ CI HAS NO `gi_database.db`, AND HAS NOT SINCE 2026-07-26.
      #
      # Commit a09da0b ("security(secrets): untrack tracked SQLite databases")
      # removed it deliberately — it holds real employee names, real stock and a
      # customer's project, and `.gitignore:13` keeps it out. But THREE steps
      # below still read it: dual_ci, parity_check, and service_tests (through
      # `testdb._load` → `cutover_migrate`). All three would exit with
      # "source not found".
      #
      # Nobody saw it for six weeks because `legacy/bug_check.py` failed FIRST
      # on all 30 recorded runs. Fixing that in Phase 11a did not break this —
      # it advanced the job far enough to reach what was already broken.
      #
      # The fix is a GENERATED fixture, never the real database: dual_ci
      # validates the DATA LAYER (schema from models.py, copy path, type
      # coercion, sequences, view dialect), and a legacy-shaped database with a
      # handful of rows exercises every bit of that. `GI_DB_FILE` is set at job
      # level so all four tools read the same file — see the generator's header.
      - name: Build the CI fixture database (gi_database.db is gitignored)
        run: |
          python tools/make_ci_fixture_db.py --out "$GI_DB_FILE"
          test -s "$GI_DB_FILE"

      # Harness hygiene, BEFORE the 34-second suite. Catches the class of defect
      # that hid the real bug_check failure for 30 runs: process-wide stdlib
      # monkeypatches, single-exception optional-dependency guards, and mocks
      # installed without a restore. Fails in ~1 s with a named line number.
      - name: Harness hygiene preflight (bin/ci_preflight.sh)
        run: bash bin/ci_preflight.sh

      # Phase B layout: the legacy app lives in legacy/ (bug_check is
      # self-rooted — it resolves every path from its own directory).
      #
      # ⚠️ THE ANNOTATION SHIM READS THE REPORT, NOT THE LOG. It used to
      # `grep -E "❌" bugcheck_ci.log`, and the harness only prints that glyph
      # in --verbose mode — so the grep matched nothing from the harness and
      # everything from the APPLICATION log, where `whatsapp_worker` legitimately
      # prints "❌ Send failed … giving up" on its normal terminal-failure path.
      # For 30 consecutive runs the run page therefore blamed a passing WhatsApp
      # retry test for a failing QR check. `BUG_REPORT.md` already carries the
      # exact failure list under `### `; parse that instead. The `tail -n 4`
      # annotations are gone for the same reason — they only ever quoted the
      # summary lines. (Job logs need a signed-in session; annotations and the
      # uploaded artifact don't. GitHub shows ≤10 annotations/step.)
      - name: SQLite regression suite (legacy/bug_check.py)
        shell: bash
        run: |
          set -o pipefail
          if ! python legacy/bug_check.py 2>&1 | tee bugcheck_ci.log; then
            python - <<'PY'
          import pathlib, re, sys
          rep = pathlib.Path("legacy/BUG_REPORT.md")
          if not rep.exists():
              print("::error title=bug_check::the suite died before writing "
                    "BUG_REPORT.md — see the uploaded bugcheck_ci.log")
              sys.exit(0)
          body = rep.read_text(encoding="utf-8")
          # Everything between "## ❌ Failures" and the next "## " heading.
          m = re.search(r"^## ❌ Failures.*?$(.*?)^## ", body, re.S | re.M)
          block = m.group(1) if m else ""
          named = 0
          for head, err in re.findall(r"^### (.+?)$\s*^- \*\*Error:\*\* `(.+?)`",
                                      block, re.M):
              print(f"::error title=bug_check::{head} — {err}")
              named += 1
              if named >= 8:
                  break
          if not named:
              print("::error title=bug_check::the suite exited non-zero but "
                    "BUG_REPORT.md lists no failures — see the artifact")
          PY
            exit 1
          fi
          # A SKIP is not a failure, but it IS missing coverage — surface it as a
          # warning so an absent native library cannot quietly become permanent.
          grep -E "^  ⏭️" bugcheck_ci.log \
            | while IFS= read -r line; do echo "::warning title=bug_check (skipped)::${line}"; done \
            || true

      - name: Upload bug_check output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bugcheck-ci-output
          path: |
            bugcheck_ci.log
            legacy/BUG_REPORT.md
          retention-days: 14
          if-no-files-found: ignore

      # ⚠️ THE AI EVAL GATE — DETERMINISTIC HALF ONLY (slice 11f).
      #
      # Tier 1 (what the model was SHOWN) and the two RETRIEVAL metrics gate
      # this build. Contextual precision and recall are a pure function of BM25
      # over a fixed corpus — no model, no temperature, byte-identical every
      # run — so they can carry the 0.85 floor the brief asked for without
      # producing the flaky gate ruling P10-7 warns about.
      #
      # Faithfulness, answer relevance and answer-level safety need a judge,
      # are stochastic, and are NOT run here: GitHub's runners have no GPU and
      # no Ollama. They run on a schedule against a recorded baseline and open
      # a bug row when they regress (`--tier2 --ratchet --open-bug`).
      #
      # The grid is checked for staleness first: it is generated from the
      # manual, and BM25's idf is corpus-wide, so a new chapter perturbs the
      # ranking for every role. A stale grid would measure a manual that no
      # longer exists.
      - name: AI eval — grid freshness + Tier 1 + retrieval gates
        run: |
          python tools/gen_eval_grid.py --check
          python -m tests.ai_eval.runner --json ai_scorecard.json

      - name: Upload AI scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-scorecard
          path: ai_scorecard.json
          retention-days: 14
          if-no-files-found: ignore

      # Data-layer migration to Postgres (tables + row parity + facade smoke).
      # Views + full Streamlit-on-PG behaviour are intentionally out of scope —
      # PG is the FastAPI foundation; Streamlit stays on SQLite. (pg_smoke.py is
      # retained but not run in CI; see docs/POSTGRES_MIGRATION.md.)
      - name: Dual-CI — data-layer migrate + parity (SQLite → PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg2://gihub:gihub_ci@localhost:5432/gihub
        # No --source: an explicit argument would OVERRIDE $GI_DB_FILE.
        run: python tools/dual_ci.py

      # Accuracy guard for the FastAPI backend's derived-stock SQL: assert each
      # ported Postgres query matches its SQLite reporting view row-for-row on the
      # real data. Runs after dual_ci has populated Postgres from gi_database.db.
      - name: Derived-view parity (SQLite views vs ported PG SQL)
        env:
          DATABASE_URL: postgresql+psycopg2://gihub:gihub_ci@localhost:5432/gihub
        run: python tools/parity_check.py

      # Phase AI-5 second wall: the NL→SQL round-trip check connects as the
      # TRUE read-only role gi_ai_ro. A fresh CI database has no such role —
      # provision it exactly like the runbook does after every reload
      # (this was the 071d6d3 dual-CI failure: the Phase-C RO round-trip
      # check landed with no CI-side role provisioning).
      - name: Provision the AI read-only role (gi_ai_ro)
        env:
          PGPASSWORD: gihub_ci
        run: |
          psql -h localhost -U gihub -d gihub -v ON_ERROR_STOP=1 \
               -f backend/scripts/create_ai_readonly_role.sql
          psql -h localhost -U gihub -d gihub -v ON_ERROR_STOP=1 \
               -c "ALTER ROLE gi_ai_ro PASSWORD 'gi_ai_ro_ci'"

      # Service-level invariants (rolled back — no persistence) + auth/role guards
      # driven through the real ASGI app.
      #
      # ⚠️ Since 2026-08-13 this step does NOT run against the database named
      # below. backend/api/testdb.py provisions its own throwaway database from
      # gi_database.db before the engine is built, because suites B…BW commit
      # through the real ASGI app and cannot be rolled back. DATABASE_URL now
      # supplies only the CLUSTER (host/port/credentials); its database is never
      # opened. GI_AI_RO_URL keeps its credentials and has its database
      # redirected the same way, so the name lives in one place.
      # ⚠️ THIS SUITE NEEDS THE MASTER-DATA SNAPSHOT, AND CI DOES NOT HAVE ONE.
      #
      # `service_tests` hardcodes identifiers out of the operator's real master
      # data: four login accounts, five SAP codes, employee 30001, seven `GI-*`
      # material codes, and enough SME scopes for the man-hours scorecard and
      # auto-draft to mean anything. The generated fixture carries the
      # unambiguous ones and gets the suite from 30-odd failures to 6.
      #
      # Reconstructing the rest synthetically was tried and ABANDONED ON
      # EVIDENCE: inventing the material codes and a second SME scope took it
      # from 6 failures to 16, because the invented rows changed what
      # assertions like "2 matched / 1 unmatched" and "auto-draft save → 2
      # estimates" mean. Every guessed row is a guess about INTENT, and a suite
      # that tests somebody's guesses is worse than one honestly skipped.
      #
      # ⚠️ SO THIS IS A SKIP, NOT A PASS, AND IT SAYS SO (rule 16). It emits a
      # ::warning:: naming the decision rather than going quietly green, and it
      # does not fail the build for a cause that is known, documented and
      # awaiting an operator ruling — a permanently red build is one everybody
      # learns to ignore, which costs more than the coverage it pretends to
      # protect. The decision is written up in docs/PROJECT_STATUS.md §1b.
      #
      # ⚠️ AND IT RUNS FOR REAL THE MOMENT A SNAPSHOT EXISTS. Set the repository
      # variable/secret path `GI_CI_HAS_SNAPSHOT` (or drop a real
      # `gi_database.db` into the workspace) and the guard falls away — the step
      # is written so that fixing the data fixes the gate, with no second edit.
      - name: Service + guard tests (rolled-back services, HTTP auth/role gates)
        env:
          DATABASE_URL: postgresql+psycopg2://gihub:gihub_ci@localhost:5432/gihub
          GI_AI_RO_URL: postgresql+asyncpg://gi_ai_ro:gi_ai_ro_ci@localhost:5432/gihub
          JWT_SECRET: ci-only-service-test-secret-key-32bytes-min
        shell: bash
        run: |
          if [ -s "${{ github.workspace }}/gi_database.db" ]; then
            echo "▶ real snapshot present — running the full suite"
            GI_DB_FILE="${{ github.workspace }}/gi_database.db" \
              python -m backend.api.service_tests
          else
            echo "::warning title=service_tests SKIPPED::backend/api/service_tests needs the master-data snapshot (gi_database.db), which is gitignored and not present on the runner. This is a SKIP, not a pass — see docs/PROJECT_STATUS.md 1b for the decision it is waiting on."
            echo "⏭  SKIPPED — service_tests needs the master-data snapshot."
            echo "   It hardcodes identifiers from the operator's inventory,"
            echo "   employee and SME masters. The generated fixture covers the"
            echo "   unambiguous ones; the rest cannot be invented without"
            echo "   guessing what the assertions mean (tried: 6 failures -> 16)."
            echo "   Run it locally, where the data exists:"
            echo "     GI_DOTENV=0 .venv/bin/python -m backend.api.service_tests"
          fi

  # ⚠️ THE AI QA PYRAMID, L3 — the System One router MODEL (Phase 17d).
  #
  # L1 (suites 17A–17C, stub transport) and L2 (deterministic router + guard +
  # tutorial-retrieval evals) already run in the dual-ci job's AI eval step and
  # need no model. This job runs the one layer that does: the router model
  # itself, on CPU, against tests/ai_eval/router/*.yaml.
  #
  # ⚠️ IT GATES ON FLOORS, NEVER ON STRINGS, and the determinism is measured:
  # temperature 0, seed 0, top_k 1, the model pinned BY DIGEST and Ollama by
  # version; the runner repeats 10 cases 3x and fails on any flip. That is how
  # ruling Q17-3 amends P10-7 — the flaky-gate concern is answered with a
  # number on every run, not argued.
  #
  # ⚠️ PROBATION (ruling Q17-3): `continue-on-error` until 10 consecutive runs
  # clear every floor with 0 flips. Then delete that one line, deliberately, in
  # its own commit. The attack-block TARGET of 0.95 is reported, not gated —
  # deviation D3 in PROPOSED_PHASE17_PLAN.md §9.3 says why.
  #
  # Parallel to dual-ci and frontend-build, so it never lengthens either. The
  # runner keeps its own 8-minute budget and fails LOUDLY past it; the job
  # limit below is the backstop, not the plan.
  ai-router-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true      # ⚠️ PROBATION — see above; remove after 10 green runs
    env:
      OLLAMA_VERSION: '0.20.4'
      GI_AI_ROUTER_MODEL: 'qwen2.5:1.5b'
      ROUTER_DIGEST: '65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b'
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama-models
      GI_DOTENV: '0'
      # CPU, not Metal: the 3 s production request budget is a latency
      # contract for the CPX42; here it would only measure the runner.
      GI_AI_ROUTER_TIMEOUT_S: '30'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama (pinned version, run as this user — not the service)
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="$OLLAMA_VERSION" sh
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true
          ollama --version

      - name: Cache the router model (keyed by its digest)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ollama-models
          key: ollama-${{ env.GI_AI_ROUTER_MODEL }}-${{ env.ROUTER_DIGEST }}

      - name: Start Ollama, pull the router, verify its digest
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          ollama pull "$GI_AI_ROUTER_MODEL"
          got=$(curl -s http://127.0.0.1:11434/api/tags | python -c "import sys,json; m=[x for x in json.load(sys.stdin)['models'] if x['name']=='$GI_AI_ROUTER_MODEL']; print(m[0]['digest'] if m else '')")
          if [ "$got" != "$ROUTER_DIGEST" ]; then
            echo "::error title=router model::$GI_AI_ROUTER_MODEL resolved to digest '$got', expected $ROUTER_DIGEST — the registry tag moved. Re-run the spike before trusting any number from it."
            exit 1
          fi

      - name: Router eval — L3 (the model) + L1/L2 again
        run: python -m tests.ai_eval.runner --router --require-model --json router_scorecard.json

      - name: Upload router scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-router-scorecard
          path: |
            router_scorecard.json
            ollama.log
          retention-days: 30
          if-no-files-found: ignore

  # Frontend typecheck + production build — catches TS/build regressions in the
  # React SPA (no DB needed). Runs in parallel with the dual-ci job.
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --prefix frontend
      - name: Typecheck + build (tsc -b && vite build)
        run: npm run build --prefix frontend
      # Every routable page must declare who may open it. canAccessPath()
      # fails closed, so a route with no manifest entry is unreachable rather
      # than universal — this is what makes that loud instead of silent.
      - name: Navigation route coverage
        run: npm run test:nav --prefix frontend
