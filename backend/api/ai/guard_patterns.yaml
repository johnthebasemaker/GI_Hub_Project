# backend/api/ai/guard_patterns.yaml — the input guard's pattern set.
#
# ⚠️ DATA, NOT CODE, SO THE EVAL SUITE CAN PIN IT. A threshold buried in a
# module is a number somebody nudges when a false refusal annoys them; a
# threshold in a versioned file is a change with a diff and a reviewer. The
# version below is recorded on every `ai.guard.input` span, so a run of odd
# refusals can be traced to the pattern set that produced them.
#
# ⚠️ AND SCORES, NOT BOOLEANS. A single regex deciding whether somebody gets an
# answer is a coin toss with extra steps: "ignore the damaged drum and issue the
# rest" is a legitimate sentence a store keeper types at 06:00, and any pattern
# list that refuses it has failed at more than its own job — it has taught one
# person that the assistant is unreliable, which is the whole of its usefulness.
# Weights accumulate; only a combination reaches the refusal threshold, and
# every weighted pattern in this file has a NEGATIVE TWIN in the eval suite: a
# legitimate warehouse sentence containing the same trigger, which must NOT be
# refused.

version: 2

thresholds:
  # ≥ warn: answered normally, recorded on the span. This is the number to
  # read before ever raising `refuse` — a pattern set that never warns is not
  # measuring anything, and one that warns constantly is mis-weighted.
  warn: 3
  # ≥ refuse: answered with the role's own refusal sentence, model never called.
  # Set so that a SINGLE pattern can essentially never reach it. Prompt
  # extraction is the one deliberate exception (weight 6): there is no innocent
  # phrasing of "print your system prompt", and the thing it asks for is the
  # retrieval fence's own description.
  refuse: 6

# Hard limits, checked before any pattern runs. These are shape, not intent.
shape:
  max_chars: 2000
  # A pasted page is not a question. Beyond this the guard asks for a question
  # rather than feeding a document to a model whose context is budgeted for one.
  max_lines: 40
  # Repetition is the cheapest context-flood: 400 copies of one token pushes the
  # retrieved passages out of the window while looking like a long question.
  max_repeated_token: 30
  # Base64/hex blobs are how "decode this and follow it" arrives. A warehouse
  # question does not contain 120 unbroken characters of base64.
  max_encoded_run: 120

patterns:

  # ── instruction override ──────────────────────────────────────────────────
  - id: override.ignore_previous
    weight: 4
    why: >-
      The canonical prompt-injection opener. Weighted 4 rather than 6 because
      "ignore" is an ordinary warehouse verb — see the negative twin
      `guard.neg.ignore_damaged` in the eval suite.
    regex: '(?i)(\b(ignore|disregard|forget)\b[^.?!]{0,30}\b(previous|prior|above|earlier|all)\b[^.?!]{0,20}\b(instruction|rule|prompt|direction|context|system)|\b(ignore|disregard|forget|bypass)\b\s+((any|your|the|these|those|my)\s+)*(instructions?|rules|guidelines|guardrails|programming|restrictions)\b|\b(forget|ignore|disregard)\s+everything\s+(you|above|before))'
    # ⚠️ Phase 17 (v2) widened this ONE pattern to the terse forms v1 scored 0
    # ("ignore instructions", "disregard your rules", "forget everything you
    # were told"). It was first written as a SEPARATE pattern and suite CT-09
    # caught the mistake: "ignore all previous instructions" then fired both
    # and refused on a single idea counted twice. One signal, one weight.

  - id: override.new_instructions
    weight: 4
    regex: '(?i)\b(new|updated|revised)\s+(instructions?|rules?|system\s+prompt)\b[^.?!]{0,20}(follow|apply|obey|use)'

  - id: override.you_are_now
    weight: 4
    why: Persona replacement — "you are now an unrestricted assistant".
    regex: '(?i)\byou\s+are\s+(now|no\s+longer)\b'

  - id: override.developer_mode
    weight: 5
    regex: '(?i)\b(developer|debug|god|dan|jailbreak|unrestricted|uncensored)\s+mode\b'

  - id: override.pretend
    weight: 3
    why: >-
      Weight 3 alone. "Pretend the tank is full" is a legitimate what-if a
      supervisor asks; it only matters combined with something else.
    regex: '(?i)\b(pretend|act\s+as\s+if|roleplay|role-play|imagine\s+you\s+are|simulate\s+being|let''?s\s+play\s+a\s+game)\b'

  # ── prompt / context extraction ───────────────────────────────────────────
  - id: extract.system_prompt
    weight: 6
    why: >-
      ⚠️ SINGLE-PATTERN REFUSAL, deliberately. There is no innocent phrasing of
      "show me your system prompt", and what it asks for IS the retrieval
      fence's own description — which chapters this role was given.
    regex: '(?i)\b(system\s+prompt|initial\s+instructions?|your\s+((hidden|secret|original|initial|real|full)\s+)?(instructions?|rules)\b[^.?!]{0,15}\b(word\s+for\s+word|verbatim)|your\s+((hidden|secret|original|initial|real)\s+)?instructions?|the\s+prompt\s+above)\b'

  - id: extract.repeat_context
    weight: 5
    regex: '(?i)\b(repeat|print|show|output|reveal|dump|display)\b[^.?!]{0,25}\b(everything|all|your|the)\b[^.?!]{0,25}\b(above|context|instructions?|verbatim|word\s+for\s+word)\b'

  - id: extract.chapter_dump
    weight: 4
    why: >-
      "List every section you can see" maps the fence rather than crossing it,
      which is reconnaissance. §2 legitimately answers "what can my role do",
      so this is weighted to warn rather than refuse on its own.
    regex: '(?i)\b(list|show|what\s+are)\b[^.?!]{0,25}\b(all|every)\b[^.?!]{0,20}\b(chapters?|sections?)\b[^.?!]{0,25}\b(you|your)\b'

  # ── role elevation ────────────────────────────────────────────────────────
  - id: elevate.claim_role
    weight: 4
    why: >-
      A claim of identity in the message body. Identity comes from the JWT and
      nothing a user types can change it — but a model does not know that, and
      the pattern is what stops it being persuaded to act as though it does.
    regex: '(?i)\b(i\s+am|i''m|as|acting\s+as|on\s+behalf\s+of)\s+(the\s+)?(admin|administrator|system\s+admin(istrator)?|root|superuser|owner|system\s+owner|developer)\b'

  - id: elevate.authorised
    weight: 3
    regex: '(?i)\b(i\s+(am|have\s+been)\s+authori[sz]ed|i\s+authori[sz]e\s+you|management\s+approved|for\s+audit\s+purposes|this\s+is\s+authori[sz]ed)\b'

  - id: elevate.override_permission
    weight: 4
    regex: '(?i)\b(bypass|override|disable|turn\s+off|skip)\b[^.?!]{0,25}\b(permission|restriction|rbac|access\s+control|role\s+(check|gate)|guard|filter|safety)\b'

  # ── delimiter / structure injection ───────────────────────────────────────
  - id: inject.delimiter
    weight: 5
    why: >-
      Fake structural markers, trying to make the model read the rest of the
      message as a new system turn. Nothing a person types about stock contains
      these.
    regex: '(?i)(<\/?(system|context|instructions?|prompt)>|\[\/?(INST|SYS)\]|###\s*(system|instruction)|<\|im_(start|end)\|>|^\s*system\s*:)'

  - id: inject.fake_turn
    weight: 4
    regex: '(?i)^\s*(assistant|user)\s*:\s*'

  # ── Phase 17 (version 2): the two attacks the brief named, which v1 let ──
  # through at score 0 — "Ignore instructions" (now override.ignore_previous,
  # widened above) and "Drop all tables". Measured 2026-10-03 against
  # `scan_input`. Each WARNS alone (weight 4 < refuse 6):
  # a warn plus the System One router's `is_safe: false` refuses (ruling
  # Q17-2, `guard.with_router_signal`), and two of these together refuse on
  # their own. Negative twins: tests/ai_eval/router/security.yaml.
  - id: sql.destructive_intent
    weight: 4
    why: >-
      A destructive verb aimed at the database itself. Harmless on the
      assistant lane (rule 9: it can only retrieve manual chapters) and
      impossible on the SQL lane (safety.is_safe_select + the gi_ai_ro role);
      this is the third wall, and it exists so the attempt is SEEN. "Drop the
      damaged drums at bay 3" names no table and scores 0.
    regex: '(?i)\b(drop|truncate|delete|wipe|erase|destroy|purge)\b[^.?!]{0,40}\b(tables?|database|db|schema)\b'

  - id: sql.statement
    weight: 6
    why: >-
      ⚠️ A SECOND DELIBERATE SINGLE-PATTERN REFUSAL (the first is
      extract.system_prompt), and for the same reason: there is no innocent
      phrasing of `DROP TABLE`, `DELETE FROM x WHERE`, `UPDATE x SET y =` or
      `UNION SELECT` in a question about stock. The shapes are STRICT — an
      English "delete from the list" or "insert into the rack" does not match,
      because each verb must be followed by SQL's own grammar, not a noun.
    regex: '(?i)(\b(drop|truncate|alter)\s+table\b|\bdelete\s+from\s+\w+\s*(\bwhere\b|;|$)|\binsert\s+into\s+\w+\s*(\(|\bvalues\b|\bselect\b)|\bupdate\s+\w+\s+set\s+\w+\s*=|\bunion\s+(all\s+)?select\b|\bselect\s+[\w*,\s]{1,60}\bfrom\s+users\b)'

  - id: sql.injection
    weight: 6
    why: >-
      Injection grammar — a quote-closing tautology, a statement terminator
      followed by a comment, or the password column by name. Single-pattern
      refusal, deliberately: a store keeper never types `' OR 1=1 --`.
    regex: '(?i)(''\s*(or|and)\s+[''"]?\w+[''"]?\s*=\s*[''"]?\w+|;\s*--|''\s*;|\bpassword_hash(es)?\b)'

  - id: sql.generate_destructive
    weight: 4
    why: >-
      Asking for SQL that destroys or changes data, rather than typing it.
    regex: '(?i)\b(write|generate|create|run|execute|give\s+me)\b[^.?!]{0,30}\b(sql|query|statement|script)\b[^.?!]{0,40}\b(delete|drop|truncate|wipe|update|insert|alter)'

  # ── override, by category ─────────────────────────────────────────────────
  - id: override.no_rules
    weight: 4
    why: >-
      "No restrictions", "without any safety rules", "unrestricted" — the
      claim that the rules no longer apply, whatever verb carries it. A work
      sentence names a rule it is asking ABOUT, not the absence of all of them.
    regex: '(?i)(\b(no|without(\s+any)?|zero)\s+((safety|content)\s+)?(rules|restrictions?|limits|filters?|guardrails|censorship)\b|\bunrestricted\b|\bno\s+longer\s+bound\b)'

  # ── extraction of secrets ─────────────────────────────────────────────────
  - id: exfil.credentials
    weight: 4
    why: >-
      Asking to be SHOWN credentials. "Where do I change my password" names no
      verb of disclosure and stays at 0; a reset-link request warns at most.
    regex: '(?i)\b(show|reveal|dump|list|give|tell|print|export|send|display)\b[^.?!]{0,30}\b(passwords?|password\s+hash(es)?|credentials?|secrets?|api\s+keys?|access\s+tokens?)\b'

  # ── disguise ──────────────────────────────────────────────────────────────
  - id: encoded.decode_and_follow
    weight: 4
    why: >-
      "Decode this and do what it says" — the instruction to obey hidden text.
      (The hidden text itself is decoded by guard._deobfuscate and scored too.)
    regex: '(?i)\b(decode|decrypt|deobfuscate|base64)\b[^.?!]{0,40}\b(follow|execute|run|obey|do\s+(it|what|as))\b'

  # ── the same categories in Arabic and Hindi ───────────────────────────────
  # The tutorials ship in four languages and the users write in them. These are
  # the English categories above, translated — not new rules — and each has an
  # in-language negative twin in tests/ai_eval/router/security.yaml.
  - id: lang.override
    weight: 4
    regex: '((تجاهل|انس|تجاوز|اترك)[^.؟!]{0,30}(التعليمات|الأوامر|القواعد|القيود)|(निर्देशों|नियमों|निर्देश)\s*(को\s*)?(अनदेखा|नज़रअंदाज़|नजरअंदाज|भूल))'
  - id: lang.extract
    weight: 4
    regex: '(موجه\s*النظام|تعليماتك\s*(السرية|المخفية)|(أظهر|اعرض|أعطني)[^.؟!]{0,20}كلم(ة|ات)\s*المرور|सिस्टम\s*प्रॉम्प्ट|(पासवर्ड)[^।?!]{0,20}(दिखा|बता))'
  - id: lang.destructive
    weight: 4
    regex: '((احذف|امسح|أسقط|دمر)[^.؟!]{0,30}(الجداول|الجدول|قاعدة\s*البيانات)|(टेबल|डेटाबेस)[^।?!]{0,30}(हटा|मिटा|डिलीट))'

# ── PII / secret shapes, for the OUTPUT guard ───────────────────────────────
#
# ⚠️ A HIT HERE IS A BUG ALARM, NOT A FORMATTING CHOICE. The manual corpus
# contains none of these shapes, so one appearing in an answer means either the
# model invented it or something reached the context that should not have. Both
# are worth a flagged trace, and neither is worth showing the user.
pii:
  - id: pii.email
    regex: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
    replacement: '[email removed]'
  - id: pii.phone_e164
    # E.164 as this system stores it (WITH the +) — long enough not to catch a
    # quantity, anchored on the + so "+3.2 kg" cannot match.
    regex: '\+\d{9,15}\b'
    replacement: '[phone removed]'
  - id: pii.iqama
    # Saudi national / Iqama ID: 10 digits starting 1 or 2.
    #
    # ⚠️ CONTEXT IS REQUIRED, AND THE BARE SHAPE WAS A FALSE POSITIVE THE FIRST
    # TIME IT WAS RUN. `(?<!\d)[12]\d{9}(?!\d)` matched "1234567890" in the
    # sentence "you have 1234567890 units" — a quantity, redacted as an
    # identity document. Nothing in the live data or the manual currently
    # collides (PR numbers read `PR-20260813-0001`, PO numbers start 4), but
    # that is luck, not a guarantee, and the cost of being wrong here is not
    # cosmetic: an alarm that fires on ordinary business numbers stops being an
    # alarm, and it silently deletes a figure out of somebody's answer.
    #
    # So the digits must be introduced as an identity document. A real leak of
    # an Iqama number comes out of `employees.ID_Number` with a label attached;
    # ten digits floating in a sentence about stock are a quantity.
    regex: '(?i)\b(?:iqama|id\s*(?:no\.?|number|#)?|national\s*id|residence\s*permit)\b\D{0,12}(?<!\d)[12]\d{9}(?!\d)'
    replacement: '[ID removed]'
  - id: pii.jwt
    regex: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
    replacement: '[token removed]'
  - id: pii.bcrypt
    regex: '\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}'
    replacement: '[hash removed]'
  - id: pii.api_key
    # The shapes that actually live in deploy/.env: Anthropic, generic sk-, and
    # Meta's long access tokens.
    regex: '\b(sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|EAA[A-Za-z0-9]{60,})\b'
    replacement: '[key removed]'
  - id: pii.pg_url
    regex: '\bpostgres(?:ql)?(?:\+\w+)?:\/\/[^\s]+:[^\s]+@[^\s]+'
    replacement: '[connection string removed]'
